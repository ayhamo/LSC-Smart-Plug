# Builds the Docker image and pushes it to GitHub's registry (ghcr.io) on every
# push to main and on version tags. Nothing to configure: GITHUB_TOKEN is enough.
#
# After the first run the package is private by default; make it public under
# Packages -> lsc-smart-plug -> Package settings -> Change visibility, then use
#   image: ghcr.io/<your-user>/lsc-smart-plug:latest
# in docker-compose.yml instead of "build: .".
name: Build Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - plug_server.py
      - index.html
      - requirements.txt
      - tests/**
      - docker/**
      - .github/workflows/docker.yml
  pull_request:
  workflow_dispatch:
  # Monthly rebuild on the 1st at 04:00 UTC: newest python:3.14-alpine (OS and
  # Python security fixes) and newest Flask 3.x / tinytuya 1.x, tests first.
  # The server still has to pull it: docker compose pull && docker compose up -d
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read
  packages: write
  actions: write     # only used to keep the monthly schedule enabled (see below)

jobs:
  # Unit tests (simulated plugs, no network). The image is only built when they pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lsc-smart-plug
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The monthly run builds without cache, so pip installs the newest releases
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub disables scheduled workflows in a public repo after 60 days without
      # commits. Re-enabling it on every monthly run keeps the schedule alive.
      - name: Keep the monthly schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker.yml/enable"
